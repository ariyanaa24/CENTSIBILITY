$kind: http-request
url: http://localhost:3000/api/v1/categories
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "categoryName": "Food",
      "categoryType": "Expense"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code < 300) { pm.collectionVariables.set("categoryId", pm.response.json().categoryId); }
    language: text/javascript
order: 1000
