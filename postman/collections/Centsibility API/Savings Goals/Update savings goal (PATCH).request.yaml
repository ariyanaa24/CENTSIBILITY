$kind: http-request
url: http://localhost:3000/api/v1/savings-goals/{{goalId}}
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentAmount": 3000.0
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 5000
