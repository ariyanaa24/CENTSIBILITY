$kind: http-request
url: http://localhost:3000/api/v1/budgets/{{budgetId}}
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "monthlyLimit": 3500.0
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 6000
