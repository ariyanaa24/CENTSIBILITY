$kind: http-request
url: http://localhost:3000/api/v1/budgets
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "categoryId": {{categoryId}},
      "monthlyLimit": 3000.0,
      "budgetMonth": "2026-11-01",
      "alertThreshold": 80
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code < 300) { pm.collectionVariables.set("budgetId", pm.response.json().budgetId); }
    language: text/javascript
order: 1000
