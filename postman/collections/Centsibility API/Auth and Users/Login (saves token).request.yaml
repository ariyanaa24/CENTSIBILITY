$kind: http-request
url: http://localhost:3000/api/v1/auth/login
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "demo@centsibility.com",
      "password": "Demo1234"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      if (pm.response.code < 300) { pm.collectionVariables.set("token", pm.response.json().accessToken); }
    language: text/javascript
order: 2000
