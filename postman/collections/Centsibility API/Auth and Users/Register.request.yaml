$kind: http-request
url: http://localhost:3000/api/v1/users
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Demo",
      "lastName": "User",
      "email": "demo@centsibility.com",
      "password": "Demo1234"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code < 300) { pm.collectionVariables.set("userId", pm.response.json().userId); }
    language: text/javascript
order: 1000
