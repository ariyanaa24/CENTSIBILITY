$kind: http-request
url: http://localhost:3000/api/v1/users
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Demo",
      "lastName": "User",
      "email": "demo@centsibility.com",
      "password": "Demo1234"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status is 409", function () { pm.response.to.have.status(409); });
    language: text/javascript
order: 3000
