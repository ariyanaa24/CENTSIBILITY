$kind: http-request
url: http://localhost:3000/api/v1/categories
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "categoryName": "Bad",
      "categoryType": "Other"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 400", function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 4000
