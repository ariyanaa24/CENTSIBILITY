$kind: http-request
url: http://localhost:3000/api/v1/transactions
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "categoryId": {{categoryId}},
      "amount": 0,
      "transactionDate": "2026-11-22"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 400", function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 5000
