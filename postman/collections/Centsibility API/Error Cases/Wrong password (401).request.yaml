$kind: http-request
url: http://localhost:3000/api/v1/auth/login
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "demo@centsibility.com",
      "password": "WrongPass999"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status is 401", function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 2000
