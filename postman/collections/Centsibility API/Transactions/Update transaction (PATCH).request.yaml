$kind: http-request
url: http://localhost:3000/api/v1/transactions/{{transactionId}}
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "amount": 175.0,
      "description": "Lunch with friends"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 4000
