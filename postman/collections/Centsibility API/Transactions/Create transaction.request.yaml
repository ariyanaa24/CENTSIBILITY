$kind: http-request
url: http://localhost:3000/api/v1/transactions
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "categoryId": {{categoryId}},
      "amount": 150.0,
      "transactionDate": "2026-11-22",
      "description": "Lunch"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code < 300) { pm.collectionVariables.set("transactionId", pm.response.json().transactionId); }
    language: text/javascript
order: 1000
